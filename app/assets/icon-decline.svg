      <stop offset="0" stop-color="#f3f3f3" stop-opacity="0.945"/>
      <stop offset="1" stop-color="#f1f1f1" stop-opacity="0.635"/>
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <rect x="-8" y="-8" width="48" height="80" fill="#ffffff"/>
      <use href="#g" fill="#000000"/>
    </mask>
  </defs>
  <g>
    <g mask="url(#m)"><use href="#g" fill="#000000" fill-opacity="0.615"
