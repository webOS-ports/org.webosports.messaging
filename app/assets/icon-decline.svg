<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Decline cross. Two 45-degree bars 5.19 across, cut square against a box 22.45 wide
     centred on (16.0,16.0) - the arm ends are a vertical and a horizontal edge, not points.
     This icon is the other way up from the rest of the toolbar: its resting state is a white
     glyph that fades 0.94 to 0.64 down the shape, over a hard dark line on its lower edge,
     and the pressed state is flat black at 0.27 over a white one. Each of those lines is a copy of the
     glyph a pixel lower, masked to where the glyph is not, so it keeps its own colour
     instead of being tinted by the half-transparent body over it. -->
