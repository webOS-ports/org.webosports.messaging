<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Decline cross. Two 45-degree bars 5.24 across with round ends, not cut square: the
     original's arm end reaches its furthest left midway down the end rather than at a corner,
     which is a cap of r 2.62 about (7.46,7.46), so this is one stroked path.
     This icon is the other way up from the rest of the toolbar: its resting state is a white
     glyph that fades 0.96 to 0.64 down the shape, over a hard dark line on its lower edge,
     and the pressed state is flat black at 0.25 over a white one. Each of those lines is a copy of the
     glyph a pixel lower, masked to where the glyph is not, so it keeps its own colour
     instead of being tinted by the half-transparent body over it. -->
  <defs>
    <path id="g" d="M7.46,7.46 L24.76,24.76 M24.76,7.46 L7.46,24.76" fill="none" stroke-width="5.24" stroke-linecap="round"/>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="4.84" x2="0" y2="27.38">
      <stop offset="0" stop-color="#dcdcdc" stop-opacity="0.960"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.635"/>
    </linearGradient>
    <mask id="out" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <rect x="-8" y="-8" width="48" height="80" fill="#ffffff"/>
      <use href="#g" stroke="#000000"/>
    </mask>
    <mask id="in" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <use href="#g" stroke="#ffffff" stroke-width="5.94"/>
      <use href="#g" stroke="#000000" stroke-width="5.94" transform="translate(0,-1.15)"/>
    </mask>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.10"/>
    </filter>
  </defs>
  <g>
    <g mask="url(#out)"><use href="#g" stroke="#000000" stroke-opacity="0.660"
         filter="url(#blur)" transform="translate(0,0.94)"/></g>
    <use href="#g" stroke="url(#fdn)"/>
  </g>
  <g transform="translate(0,32.60)">
    <use href="#g" stroke="#000000" stroke-opacity="0.250"
         stroke-width="5.94"/>
    <use href="#g" stroke="#ffffff" stroke-opacity="0.650"
         stroke-width="5.94" mask="url(#in)"/>
  </g>
</svg>
