<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
  <defs>
    <linearGradient id="fdn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a3a3"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="fup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#606060"/><stop offset="1" stop-color="#5d5d5d"/>
    </linearGradient>
    <mask id="mdn"><rect width="32" height="32" fill="url(#fdn)"/></mask>
    <mask id="mup"><rect width="32" height="32" fill="url(#fup)"/></mask>
    <filter id="sdn" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.0" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="sup" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g stroke="#000000" stroke-width="8" fill="none" mask="url(#mdn)" filter="url(#sdn)">
    <line x1="8" y1="8" x2="24" y2="24"/><line x1="24" y1="8" x2="8" y2="24"/>
  </g>
  <g stroke="#000000" stroke-width="8" fill="none" mask="url(#mup)" filter="url(#sup)"
     transform="translate(0,32)">
    <line x1="8" y1="8" x2="24" y2="24"/><line x1="24" y1="8" x2="8" y2="24"/>
  </g>
</svg>
