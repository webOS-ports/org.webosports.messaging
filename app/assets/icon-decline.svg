<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Decline cross. Two 45-degree bars with round ends, not cut square: the original's arm
     reaches its furthest left midway down the end rather than at a corner, which is a cap.
     So the glyph is one stroked path - and it is stroked at three widths, each baked into
     its own <path>. A stroke-width on <use> is ignored when the referenced element sets one,
     and the browser will not always take one from the <use> either, so the only way to get
     three weights of the same outline that renders everywhere is three paths.
     This icon is the other way up from the rest of the toolbar. The resting state is a white
     glyph fading 0.97 to 0.62 down the shape, over a soft shadow cast OUTSIDE it - a blurred
     copy 0.88 lower, masked to where the glyph is not. The pressed state is cut into the
     surface instead: flat black at 0.235, a light rim 0.85 wide round the whole inside of it,
     and a shadow 2.40 deep over that rim on the edges that face up. Every other edge stays
     lit - at the waist the original lights both sides at once, which a band cut by a vertical
     offset cannot do, because there the two arms overlap and the offset copy fills the gap. -->
  <defs>
    <path id="gd" d="M7.46,7.46 L24.54,24.54 M24.54,7.46 L7.46,24.54" fill="none" stroke-width="5.24" stroke-linecap="round"/>
    <path id="go" d="M7.46,7.46 L24.54,24.54 M24.54,7.46 L7.46,24.54" fill="none" stroke-width="5.94" stroke-linecap="round"/>
    <path id="gi" d="M7.46,7.46 L24.54,24.54 M24.54,7.46 L7.46,24.54" fill="none" stroke-width="4.23" stroke-linecap="round"/>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="4.84" x2="0" y2="27.16">
      <stop offset="0" stop-color="#dcdcdc" stop-opacity="0.975"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.620"/>
    </linearGradient>
    <mask id="out" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <rect x="-8" y="-8" width="48" height="80" fill="#ffffff"/>
      <use href="#gd" stroke="#000000"/>
    </mask>
    <mask id="body" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <use href="#go" stroke="#ffffff"/>
    </mask>
    <mask id="ring" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <use href="#go" stroke="#ffffff"/>
      <use href="#gi" stroke="#000000"/>
    </mask>
    <mask id="upper" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="80">
      <use href="#go" stroke="#ffffff"/>
      <use href="#go" stroke="#000000" transform="translate(0,2.40)"/>
    </mask>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.10"/>
    </filter>
    <filter id="inblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <g>
    <g mask="url(#out)"><use href="#gd" stroke="#000000" stroke-opacity="0.720"
         filter="url(#blur)" transform="translate(0,0.88)"/></g>
    <use href="#gd" stroke="url(#fdn)"/>
  </g>
  <g transform="translate(0,32.54)">
    <use href="#go" stroke="#000000" stroke-opacity="0.235"/>
    <g mask="url(#ring)"><use href="#go" stroke="#ffffff" stroke-opacity="0.555"/></g>
    <g mask="url(#body)"><g filter="url(#inblur)">
      <g mask="url(#upper)"><use href="#go" stroke="#000000" stroke-opacity="0.280"/></g>
    </g></g>
  </g>
</svg>
