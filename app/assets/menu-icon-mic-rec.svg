<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Microphone, authored rather than traced. The capsule is a 6.7-wide rounded bar; the
     cradle round it drops 5.03 either side of centre, runs straight for seven rows and
     then curves into the stem, stroked 1.72. It is not a half-ellipse: the original
     keeps its sides vertical over those rows, where an ellipse bows out at the top and
