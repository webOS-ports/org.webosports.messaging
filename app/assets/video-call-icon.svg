<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Video camera: a 22.8 by 17.9 rounded body with the lens as a trapezoid off its right
     side, both authored from the original's edges rather than traced - the trace put a seam
     across the body where it broke the outline into two runs. The resting state is #1f1f1f
     fading 0.76 to 0.32 down the shape over a 2.0px bar of its own at the foot; the
     lit state is flat #6ec3ff with a 1.40 blur of itself behind, which is why its edge reads
     soft while its middle stays solid. -->
  <defs>
    <path id="g" d="M2.442,5.638 L22.012,5.638 A1.637,1.637 0 0 1 23.650,7.275 L23.650,21.938 A1.637,1.637 0 0 1 22.012,23.575 L2.442,23.575 A1.637,1.637 0 0 1 0.805,21.938 L0.805,7.275 A1.637,1.637 0 0 1 2.442,5.638 Z M21.212,11.800 Q21.212,11.000 21.953,10.698 L27.834,8.302 Q28.575,8.000 28.575,8.800 L28.575,21.350 Q28.575,22.150 27.811,21.914 L21.977,20.111 Q21.212,19.875 21.212,19.075 Z"/>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="5.64" x2="0" y2="23.57">
      <stop offset="0" stop-color="#222222" stop-opacity="0.760"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0.315"/>
    </linearGradient>
    <filter id="sup" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.40"/>
    </filter>
  </defs>
  <use href="#g" fill="url(#fdn)"/>
  <path d="M0.805,23.575 L23.650,23.575 A0.000,0.000 0 0 1 23.650,23.575 L23.650,24.575 A1.000,1.000 0 0 1 22.650,25.575 L1.805,25.575 A1.000,1.000 0 0 1 0.805,24.575 L0.805,23.575 A0.000,0.000 0 0 1 0.805,23.575 Z" fill="#1f1f1f" fill-opacity="0.630"/>
  <g transform="translate(0,32)">
    <use href="#g" fill="#6ec3ff" filter="url(#sup)"/>
    <use href="#g" fill="#6ec3ff"/>
  </g>
</svg>
