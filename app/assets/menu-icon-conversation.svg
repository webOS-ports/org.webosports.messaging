<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
<!-- Speech balloon. The outline is this glyph's own, measured off Palm's 32px original.
     It started as the vector shape layer of Icon-messaging-1024.psd - the launcher
     balloon the designer drew - placed here by an affine. That is how it was drawn
     until now, and it is wrong: the launcher icon and this toolbar glyph are two
     drawings, not one drawing at two sizes, and no affine holds both. Against the
     original's silhouette the master leaves a smooth, systematic error along the
     bottom - 0.3px too high under the left of the body, 0.2px too low out to the
     right of it - which reads as a long flat run that turns up in a corner where
     the original sweeps round in one arc. So the ten knots were let go one at a
     time against that silhouette. The bottom edge now tracks the original to 0.06px
     across the whole span, where the affine was out by up to 0.45px, and the fitted
     curve is smoother than the one it replaces, not wobblier.
     The silhouette is measured by coverage, not by a threshold. Every pixel here is
     black body at the row's alpha over white line at a fixed alpha, and over
     transparency the premultiplied red channel carries only the line, so the two
     coverages separate exactly and add up to the geometry. A fixed threshold cannot
     do this: the line is brighter than the body it is cut into, so the threshold
     walks along the edge as the line comes and goes.
     Over the shape goes the engraved line this bar wants: the original's body is
     pure black ramping 168 to 108 in alpha, and along its lower edge sits a line of
     pure WHITE at alpha 191 - black at 125 in the lit state. Both bodies are one
     flat colour with a straight alpha ramp - black 0.62 to 0.33 resting, white 0.94
     to 0.27 lit - measured interior pixel by interior pixel with the line's own
     pixels left out.
     Under both states goes a soft black halo, masked to outside the outline. The lit
     half of the original carries black out there - alpha 5 to 21 at the shoulder, 26
     to 66 round the lower left - and with nothing there ours read hard-edged against
     a soft original. Masked, because both bodies are semi-transparent and a halo laid
     under them shows through and darkens the paint instead of the bar. -->
  <defs>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#000000" stop-opacity="0.6196"/>
