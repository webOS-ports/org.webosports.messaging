    </linearGradient>
    <linearGradient id="fup" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9420"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2664"/>
    </linearGradient>
  
