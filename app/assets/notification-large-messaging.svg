<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<!-- Messaging balloon, taken from the vector shape layer of Icon-messaging-1024.psd in
     the webOS-Ports graphics repository and scaled onto this grid - the outline the
     designer drew, not a fit to a rasterised copy of it.
     The body is NOT an ellipse. It is four Bezier knots, three with axis-aligned
     tangents and the fourth, low on the right, slanted, and the tail is five more knots
     on the same closed path. Every attempt here to fit an ellipse plus a polygon tail to
     the 48px raster was fitting the wrong family of curve, and the error always came
     back at the bottom of the balloon where the two pieces met. Placed by a plain
     uniform scale, the master path tracks the original's own outline - tail included -
     to an rms of 0.21px across 37 rows, where the best ellipse managed 0.40 on the body
     alone. The gloss, the rim and the drop shadow below are still measured off the
     original, because the master is a launcher icon and lights its balloon differently. -->
<defs>
  <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="1.3" x2="0" y2="38.6">
    <stop offset="0" stop-color="#a7dddf"/><stop offset="0.09" stop-color="#91ecf1"/>
    <stop offset="0.21" stop-color="#7fe2e7"/><stop offset="0.32" stop-color="#68d2d8"/>
    <stop offset="0.44" stop-color="#50c2c8"/><stop offset="0.56" stop-color="#37b2b9"/>
    <stop offset="0.68" stop-color="#23a6ad"/><stop offset="0.79" stop-color="#00969e"/>
    <stop offset="1" stop-color="#01949b"/>
  </linearGradient>
  <radialGradient id="gloss">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.400"/>
    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.140"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="body"><path d="M5.617,42.055 C5.617,42.055 8.124,40.871 9.136,39.029 C10.366,36.789 9.418,34.729 9.418,34.729 C9.418,34.729 9.418,34.729 9.418,34.729 C9.418,34.729 2.894,30.805 2.894,22.686 C2.894,12.162 15.295,5.902 24.504,5.902 C36.694,5.902 44.648,13.526 44.648,21.673 C44.648,27.731 41.207,33.533 33.062,37.323 C27.246,40.029 18.287,38.355 18.287,38.355 C18.287,38.355 16.170,40.801 12.407,41.935 C8.432,43.134 5.617,42.055 5.617,42.055 Z"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="1.36"/>
  </filter>
</defs>
<path d="M5.617,42.055 C5.617,42.055 8.124,40.871 9.136,39.029 C10.366,36.789 9.418,34.729 9.418,34.729 C9.418,34.729 9.418,34.729 9.418,34.729 C9.418,34.729 2.894,30.805 2.894,22.686 C2.894,12.162 15.295,5.902 24.504,5.902 C36.694,5.902 44.648,13.526 44.648,21.673 C44.648,27.731 41.207,33.533 33.062,37.323 C27.246,40.029 18.287,38.355 18.287,38.355 C18.287,38.355 16.170,40.801 12.407,41.935 C8.432,43.134 5.617,42.055 5.617,42.055 Z" fill="#000000" fill-opacity="0.415" filter="url(#soft)"
      transform="translate(0,2.69)"/>
<path d="M5.617,42.055 C5.617,42.055 8.124,40.871 9.136,39.029 C10.366,36.789 9.418,34.729 9.418,34.729 C9.418,34.729 9.418,34.729 9.418,34.729 C9.418,34.729 2.894,30.805 2.894,22.686 C2.894,12.162 15.295,5.902 24.504,5.902 C36.694,5.902 44.648,13.526 44.648,21.673 C44.648,27.731 41.207,33.533 33.062,37.323 C27.246,40.029 18.287,38.355 18.287,38.355 C18.287,38.355 16.170,40.801 12.407,41.935 C8.432,43.134 5.617,42.055 5.617,42.055 Z" fill="url(#b)" stroke="#013f45" stroke-opacity="0.790"
      stroke-width="1.45" paint-order="stroke"/>
<g clip-path="url(#body)">
  <ellipse cx="24.14" cy="4.70" rx="15.04" ry="7.50" fill="url(#gloss)"/>
</g>
</svg>
