<svg xmlns="http://www.w3.org/2000/svg" width="165" height="165" viewBox="0 0 165 165">
  <!-- The watermark behind an empty conversation, measured off the one it replaces: two rings
       and not four (r 80 stroke 5.3, r 55 stroke 3.3 - the 71 and 63.5 rings never existed),
       the legend twice round the band at r 62 with a dot either side, and two balloons - the
       back one an outline, the front one a solid fill. The back one's outline is interrupted
       around the front one rather than painted over, so the two read as one in front of the
       other. Everything is #d4d4d4 at 0.70, as measured. Palm's legend said "Messaging by
       webOS"; this one says LuneOS, and it is drawn clean rather than worn. -->
  <defs>
    <path id="legend-top" d="M21.44,71.73 A62,62 0 0 1 143.56,71.73"/>
    <path id="legend-bottom" d="M143.56,93.27 A62,62 0 0 1 21.44,93.27"/>
    <g id="front">
      <path d="M98.0,103.0 L114.0,112.5 L109.0,99.0 Z"/>
      <ellipse cx="95" cy="89" rx="23.5" ry="18.5"/>
    </g>
    <!-- the gap the front balloon opens in whatever runs behind it -->
    <mask id="interrupt">
      <rect width="165" height="165" fill="#ffffff"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="9"
           stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#d4d4d4" fill-opacity="0.70">
    <g fill="none" stroke="#d4d4d4" stroke-opacity="0.70">
      <circle cx="82.5" cy="82.5" r="80" stroke-width="5.3"/>
      <circle cx="82.5" cy="82.5" r="55" stroke-width="3.3"/>
    </g>
    <circle cx="20.5" cy="82.5" r="2.2"/>
    <circle cx="144.5" cy="82.5" r="2.2"/>
    <g font-family="Prelude, 'DejaVu Sans', Arial, sans-serif" font-size="13"
       letter-spacing="1.6" text-anchor="middle">
      <text><textPath href="#legend-top" startOffset="50%">Messaging by LuneOS</textPath></text>
      <text><textPath href="#legend-bottom" startOffset="50%">Messaging by LuneOS</textPath></text>
    </g>
    <!-- back balloon: outline, centre (80.25,74) 32.75 by 27, tail down to the left -->
    <g mask="url(#interrupt)" fill="none" stroke="#d4d4d4" stroke-opacity="0.70"
       stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M61.5,95.3 A32.75,27 0 1 1 69.0,99.9"/>
      <path d="M62.0,95.0 L53.5,107.0 L70.0,99.0"/>
    </g>
    <!-- front balloon: solid, centre (95,89) 23.5 by 18.5, tail down to the right -->
    <use href="#front"/>
  </g>
</svg>
