<svg xmlns="http://www.w3.org/2000/svg" width="45" height="23" viewBox="0 0 45 23">
<!-- Delivery tick. Measured off the original: both arms run at exactly 45 degrees, the stroke
     is 6.12 across the outside of the dark keyline, the ends are round caps and the vertex is
     a round join. The colour is not a top-to-bottom gradient - it is a ramp ACROSS each arm,
     lit on the upper-left edge and shaded on the lower-right - so each arm carries its own
     perpendicular gradient, and their round caps meet at the vertex to form the join. -->
