<!-- The app's mini icon: the same balloon, in the near-white the status bar wants
     rather than the teal, scaled to the 24px the icon is used at. Its own radial
     stops run #f5f5f5 at the centre to #cecece at the rim, measured the same way.
     It carries no bounce along its lower edge: the original's is +8 of 255 where
     the teal one's is +45, and drawing it at 24px costs more than it buys. -->
