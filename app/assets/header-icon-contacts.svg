<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- The contacts mark in the header: the same two cards as attach-contact, but fanned over
     -13 degrees and ruled with the lines of a record rather than tiled. Drawn to the original;
     the 1024px master in the webOS-Ports graphics repository is the reference for the figure. -->
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#fbfbfb"/>
    <stop offset="1" stop-color="#e7e7e7"/>
  </linearGradient>
  <radialGradient id="who" cx="0.4" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#ffb866"/><stop offset="0.5" stop-color="#f79a3e"/>
    <stop offset="1" stop-color="#e8823a"/>
  </radialGradient>
  <linearGradient id="tab" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#5c5c5c" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#1c1c1c" stop-opacity="0.85"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="0.70"/>
  </filter>
</defs>
