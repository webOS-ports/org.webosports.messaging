<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 41 41">
<!-- Contact-card badge, drawn rather than resampled: three sheets of white paper fanned out
     and tilted 8.4 degrees, the front one carrying the orange figure and the two connector
     tabs, over the soft round shadow the artwork sits on. This is a redraw of the community
     art it replaces rather than a trace of the 41px bitmap - tracing that keeps the
     resampling, and the point of moving to SVG is to hold up at any size. -->
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#f2f2f2"/>
    <stop offset="1" stop-color="#dcdcdc"/>
  </linearGradient>
  <linearGradient id="who" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8b358"/><stop offset="1" stop-color="#e8801a"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.80"/>
  </filter>
</defs>
<circle cx="20.00" cy="21.00" r="16.50" fill="#000000" fill-opacity="0.34"
        filter="url(#soft)"/>
<g transform="rotate(8.44 20.50 21.07)">
  <rect x="14.50" y="5.40" width="20.50" height="19.15" rx="1.0" fill="url(#paper)" stroke="#c9c9c9" stroke-width="0.55"/>
  <rect x="9.80" y="9.00" width="23.04" height="17.00" rx="1.0" fill="url(#paper)" stroke="#c9c9c9" stroke-width="0.55"/>
  <rect x="5.50" y="13.00" width="26.00" height="19.00" rx="1.0" fill="url(#paper)" stroke="#c9c9c9" stroke-width="0.55"/>
  <circle cx="12.60" cy="19.00" r="2.75" fill="url(#who)"/>
  <path d="M11.200,21.800 L14.000,21.800 A2.400,2.400 0 0 1 16.400,24.200 L16.400,28.200 A0.000,0.000 0 0 1 16.400,28.200 L8.800,28.200 A0.000,0.000 0 0 1 8.800,28.200 L8.800,24.200 A2.400,2.400 0 0 1 11.200,21.800 Z" fill="url(#who)"/>
  <rect x="12.20" y="27.40" width="4.30" height="3.60" rx="0.60" fill="#59595b"/><rect x="22.20" y="27.40" width="4.30" height="3.60" rx="0.60" fill="#59595b"/>
</g>
</svg>
