    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#121212" stop-opacity="0.624"/>
      <stop offset="0.091" stop-color="#121212" stop-opacity="0.624"/>
      <stop offset="0.182" stop-color="#080808" stop-opacity="0.588"/>
      <stop offset="0.273" stop-color="#090909" stop-opacity="0.565"/>
      <stop offset="0.364" stop-color="#0b0b0b" stop-opacity="0.592"/>
      <stop offset="0.455" stop-color="#292929" stop-opacity="0.529"/>
      <stop offset="0.545" stop-color="#383838" stop-opacity="0.565"/>
      <stop offset="0.636" stop-color="#060606" stop-opacity="0.455"/>
      <stop offset="0.727" stop-color="#1d1d1d" stop-opacity="0.49"/>
      <stop offset="0.818" stop-color="#5b5b5b" stop-opacity="0.62"/>
      <stop offset="0.909" stop-color="#979797" stop-opacity="0.639"/>
