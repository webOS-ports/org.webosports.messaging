      <stop offset="0.000" stop-color="#f0f0f0" stop-opacity="0.804"/>
      <stop offset="0.091" stop-color="#f0f0f0" stop-opacity="0.804"/>
      <stop offset="0.182" stop-color="#ececec" stop-opacity="0.824"/>
      <stop offset="0.273" stop-color="#f0f0f0" stop-opacity="0.78"/>
      <stop offset="0.364" stop-color="#f5f5f5" stop-opacity="0.737"/>
      <stop offset="0.455" stop-color="#f5f5f5" stop-opacity="0.71"/>
      <stop offset="0.545" stop-color="#e3e3e3" stop-opacity="0.616"/>
      <stop offset="0.636" stop-color="#eaeaea" stop-opacity="0.573"/>
      <stop offset="0.727" stop-color="#f7f7f7" stop-opacity="0.514"/>
      <stop offset="0.818" stop-color="#bebebe" stop-opacity="0.502"/>
