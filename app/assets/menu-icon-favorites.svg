    <path id="g" d="M21.725,2.664 Q22.120,1.563 22.515,2.664 L25.408,10.740 Q25.715,11.596 26.625,11.623 L35.247,11.875 Q36.416,11.909 35.488,12.621 L28.659,17.858 Q27.937,18.411 28.194,19.284 L30.615,27.512 Q30.945,28.634 29.978,27.976 L22.862,23.131 Q22.109,22.619 21.357,23.131 L14.235,27.968 Q13.267,28.625 13.599,27.503 L16.028,19.278 Q16.286,18.405 15.565,17.851 L8.741,12.607 Q7.813,11.894 8.983,11.861 L17.605,11.618 Q18.515,11.593 18.823,10.736 Z"/>
