<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<!-- The app's own mark: the teal balloon behind the cream one on the shallow disc the
     original sits in. Each balloon is the VECTOR PATH out of the shape layers of
     Icon-messaging-1024.psd in the webOS-Ports graphics repository, scaled onto this grid -
     the outline the designer drew, not an ellipse fitted to a rasterised copy of it. Neither
     body is an ellipse: each is four Bezier knots with a tail of five more on the same closed
     path. Placed by scale and offset alone the master paths track the original's own outlines
     to an rms of 0.17px (teal) and 0.31px (cream). The two carry their own scales because
     Palm's 48px mark re-laid them out rather than shrinking the launcher icon whole.
     The dark rim under each fill, the vertical ramp measured down the middle of the original
     and the specular gloss across the upper third are still fitted here, because the master
     is a launcher icon and lights its balloons differently. -->
<defs>
  <linearGradient id="disc" gradientUnits="userSpaceOnUse" x1="0" y1="3.0" x2="0" y2="46.8">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.385"/>
    <stop offset="0.45" stop-color="#9a9a9a" stop-opacity="0.115"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.070"/>
  </linearGradient>
  <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="6.9" x2="0" y2="37.6">
    <stop offset="0" stop-color="#a7dddf"/><stop offset="0.09" stop-color="#91ecf1"/>
    <stop offset="0.24" stop-color="#7fe2e7"/><stop offset="0.40" stop-color="#5ccad0"/>
    <stop offset="0.60" stop-color="#37b2b9"/><stop offset="0.80" stop-color="#00969e"/>
    <stop offset="1" stop-color="#01949b"/>
  </linearGradient>
  <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="0" y1="18.6" x2="0" y2="40.7">
    <stop offset="0" stop-color="#fffbe4"/><stop offset="0.35" stop-color="#fdf4cb"/>
    <stop offset="0.75" stop-color="#f6e9ae"/><stop offset="1" stop-color="#ecdc96"/>
  </linearGradient>
  <radialGradient id="tg">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.565"/>
    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.198"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cg">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.515"/>
    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.180"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
