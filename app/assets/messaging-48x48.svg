<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<!-- The app's own mark, drawn rather than resampled: two balloons, each an ellipse with a
     stubby tail and a gloss across its upper half, over the pale halo and
     soft shadow the artwork sits on.
     A redraw of the community art it replaces, so it holds up at any size. -->
<defs>
  <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="6.6" x2="0" y2="38.3">
    <stop offset="0" stop-color="#2f9fa8"/><stop offset="0.5" stop-color="#2aa6ae"/>
    <stop offset="1" stop-color="#17808a"/>
  </linearGradient>
  <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="0" y1="20.4" x2="0" y2="41.2">
    <stop offset="0" stop-color="#fdf6d8"/><stop offset="1" stop-color="#ece2a4"/>
  </linearGradient>
  <radialGradient id="gloss">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.20"/>
  </filter>
  <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="0.90"/>
  </filter>
  <clipPath id="tclip"><path d="M2.663,20.425 A17.750,13.838 0 1 1 38.163,20.425 A17.750,13.838 0 1 1 2.663,20.425 Z M9.988,32.009 Q10.650,31.175 11.645,31.555 L16.005,33.220 Q17.000,33.600 16.110,34.186 L10.827,37.664 Q9.938,38.250 8.873,38.266 L6.040,38.309 Q4.975,38.325 5.637,37.491 Z"/></clipPath>
  <clipPath id="cclip"><path d="M19.175,29.688 A13.088,9.312 0 1 1 45.350,29.688 A13.088,9.312 0 1 1 19.175,29.688 Z M35.851,36.629 Q36.825,36.400 37.611,37.019 L42.164,40.606 Q42.950,41.225 41.951,41.181 L38.887,41.044 Q37.888,41.000 37.012,40.518 L32.588,38.082 Q31.712,37.600 32.686,37.371 Z"/></clipPath>
</defs>
<ellipse cx="24.00" cy="23.00" rx="21.50" ry="20.50" fill="#cfd4dc"
         fill-opacity="0.42" filter="url(#halo)"/>
<ellipse cx="24.00" cy="28.00" rx="20.50" ry="13.50" fill="#000000"
         fill-opacity="0.38" filter="url(#soft)"/>
<path d="M2.663,20.425 A17.750,13.838 0 1 1 38.163,20.425 A17.750,13.838 0 1 1 2.663,20.425 Z M9.988,32.009 Q10.650,31.175 11.645,31.555 L16.005,33.220 Q17.000,33.600 16.110,34.186 L10.827,37.664 Q9.938,38.250 8.873,38.266 L6.040,38.309 Q4.975,38.325 5.637,37.491 Z" fill="url(#teal)"/>
<g clip-path="url(#tclip)">
  <ellipse cx="20.93" cy="14.00" rx="12.00" ry="6.00" fill="url(#gloss)"
           opacity="0.75"/>
</g>
<path d="M19.175,29.688 A13.088,9.312 0 1 1 45.350,29.688 A13.088,9.312 0 1 1 19.175,29.688 Z M35.851,36.629 Q36.825,36.400 37.611,37.019 L42.164,40.606 Q42.950,41.225 41.951,41.181 L38.887,41.044 Q37.888,41.000 37.012,40.518 L32.588,38.082 Q31.712,37.600 32.686,37.371 Z" fill="url(#cream)" stroke="#c9a93c" stroke-opacity="0.55"
      stroke-width="0.80"/>
<g clip-path="url(#cclip)">
  <ellipse cx="31.00" cy="25.00" rx="9.00" ry="4.20" fill="url(#gloss)"
           opacity="0.60"/>
</g>
</svg>
