<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
<!-- Speech balloon with a plus. The balloon is the one from menu-icon-conversation, and
     that is not an approximation: row for row, the two originals' balloon edges agree to
     0.000 of a pixel everywhere the plus does not cover. So the shape is inherited here
     rather than fitted a second time, and only the plus and the engraved line are this
     file's own. The plus is two rectangles on whole pixels, which is how the original has
     it - its edges carry no antialiasing at all, so anything off the pixel grid reads as
     a blur. -->
