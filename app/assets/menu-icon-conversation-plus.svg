<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
<!-- Speech balloon with a plus. The balloon is the one from menu-icon-conversation, and
     that is not an approximation: row for row, the two originals' balloon edges agree to
     0.000 of a pixel everywhere the plus does not cover. So the shape is inherited here
     rather than fitted a second time, and only the plus and the engraved line are this
     file's own. The plus is two rectangles on whole pixels, which is how the original has
     it - its edges carry no antialiasing at all, so anything off the pixel grid reads as
     a blur. -->
  <defs>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#000000" stop-opacity="0.6196"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3444"/>
    </linearGradient>
    <linearGradient id="fup" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9370"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2714"/>
    </linearGradient>
  
    <filter id="h" x="-40%%" y="-40%%" width="180%%" height="180%%">
      <feGaussianBlur stdDeviation="1.10"/>
    </filter>
    <mask id="o" maskUnits="userSpaceOnUse" x="-8" y="-8" width="60" height="80">
      <rect x="-8" y="-8" width="60" height="80" fill="#ffffff"/>
      <use href="#g" fill="#000000" fill-rule="nonzero"/>
    </mask>
    <path id="g" d="M8.705,28.524 C8.705,28.524 10.423,27.679 11.130,26.365 C11.991,24.766 11.369,23.297 11.369,23.297 C11.369,23.297 11.369,23.297 11.369,23.297 C11.369,23.297 6.976,20.497 7.064,14.704 C7.178,7.195 15.675,2.728 21.936,2.728 C30.222,2.728 35.547,8.168 35.459,13.981 C35.394,18.303 32.991,22.443 27.414,25.147 C23.431,27.078 17.359,25.884 17.359,25.884 C17.359,25.884 15.893,27.629 13.323,28.438 C10.608,29.293 8.705,28.524 8.705,28.524 Z M37.96,3.00 L40.04,3.00 L40.04,11.85 L37.96,11.85 Z M34.92,6.00 L43.04,6.00 L43.04,9.07 L34.92,9.07 Z"/>
    <mask id="e" maskUnits="userSpaceOnUse" x="-8" y="-8" width="60" height="80">
      <use href="#g" fill="#ffffff" fill-rule="nonzero"/>
      <use href="#g" fill="#000000" fill-rule="nonzero" transform="translate(0,-0.94)"/>
    </mask>
    <mask id="n" maskUnits="userSpaceOnUse" x="-8" y="-8" width="60" height="80">
      <rect x="-8" y="-8" width="60" height="80" fill="#ffffff"/>
      <use href="#g" fill="#000000" fill-rule="nonzero"/>
      <use href="#g" fill="#ffffff" fill-rule="nonzero" transform="translate(0,-0.94)"/>
    </mask>
  </defs>
  <g>
    <g mask="url(#o)"><use href="#g" fill="#000000" fill-opacity="0.000"
         fill-rule="nonzero" filter="url(#h)" transform="translate(0,0.46)"/></g>
    <g mask="url(#n)"><use href="#g" fill="url(#fdn)" fill-opacity="0.970"
         fill-rule="nonzero"/></g>
    <g mask="url(#e)"><use href="#g" fill="#ffffff" fill-opacity="0.894"
         fill-rule="nonzero"/></g>
  </g>
  <g transform="translate(0,32)">
    <g mask="url(#o)"><use href="#g" fill="#000000" fill-opacity="0.455"
         fill-rule="nonzero" filter="url(#h)" transform="translate(0,0.46)"/></g>
    <g mask="url(#n)"><use href="#g" fill="url(#fup)" fill-opacity="1.000"
         fill-rule="nonzero"/></g>
    <g mask="url(#e)"><use href="#g" fill="#000000" fill-opacity="0.565"
         fill-rule="nonzero"/></g>
  </g>
</svg>
