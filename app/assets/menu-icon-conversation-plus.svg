<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
<!-- Speech balloon with a plus. The balloon is the one from menu-icon-conversation; the
     plus is two rectangles on whole pixels, which is how the original has it - its edges
     carry no antialiasing at all, so anything off the pixel grid reads as a blur. -->
  <defs>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#000000" stop-opacity="0.659"/>
      <stop offset="0.091" stop-color="#000000" stop-opacity="0.659"/>
      <stop offset="0.182" stop-color="#000000" stop-opacity="0.624"/>
      <stop offset="0.273" stop-color="#242424" stop-opacity="0.604"/>
      <stop offset="0.364" stop-color="#090909" stop-opacity="0.514"/>
      <stop offset="0.455" stop-color="#030303" stop-opacity="0.486"/>
      <stop offset="0.545" stop-color="#090909" stop-opacity="0.463"/>
      <stop offset="0.636" stop-color="#141414" stop-opacity="0.451"/>
      <stop offset="0.727" stop-color="#252525" stop-opacity="0.471"/>
      <stop offset="0.818" stop-color="#838383" stop-opacity="0.706"/>
      <stop offset="0.909" stop-color="#979797" stop-opacity="0.647"/>
      <stop offset="1.000" stop-color="#979797" stop-opacity="0.647"/>
    </linearGradient>
    <linearGradient id="fup" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#f9f9f9" stop-opacity="0.922"/>
      <stop offset="0.091" stop-color="#f9f9f9" stop-opacity="0.922"/>
      <stop offset="0.182" stop-color="#fdfdfd" stop-opacity="0.835"/>
      <stop offset="0.273" stop-color="#ececec" stop-opacity="0.761"/>
      <stop offset="0.364" stop-color="#fdfdfd" stop-opacity="0.722"/>
      <stop offset="0.455" stop-color="#fcfcfc" stop-opacity="0.659"/>
      <stop offset="0.545" stop-color="#fafafa" stop-opacity="0.592"/>
      <stop offset="0.636" stop-color="#f3f3f3" stop-opacity="0.549"/>
      <stop offset="0.727" stop-color="#e3e3e3" stop-opacity="0.486"/>
      <stop offset="0.818" stop-color="#909090" stop-opacity="0.49"/>
      <stop offset="0.909" stop-color="#a5a5a5" stop-opacity="0.51"/>
      <stop offset="1.000" stop-color="#a5a5a5" stop-opacity="0.51"/>
    </linearGradient>
  
    <path id="g" d="M7.375,14.275 A14.062,11.588 0 1 1 35.500,14.275 A14.062,11.588 0 1 1 7.375,14.275 Z M25.476,25.374 Q12.550,27.050 10.463,29.300 Q7.287,25.950 14.698,24.445 Z M38.08,3.00 L39.92,3.00 L39.92,11.55 L38.08,11.55 Z M34.92,6.00 L43.08,6.00 L43.08,8.85 L34.92,8.85 Z"/>
    <mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="60" height="80">
      <rect x="-8" y="-8" width="60" height="80" fill="#ffffff"/>
      <use href="#g" fill="#000000"/>
    </mask>
  </defs>
  <g>
    <g mask="url(#m)"><use href="#g" fill="#ffffff" fill-opacity="0.000"
         fill-rule="nonzero" transform="translate(0,0.94)"/></g>
    <use href="#g" fill="url(#fdn)" fill-opacity="0.970" fill-rule="nonzero"/>
  </g>
  <g transform="translate(0,32)">
    <g mask="url(#m)"><use href="#g" fill="#000000" fill-opacity="0.355"
         fill-rule="nonzero" transform="translate(0,0.94)"/></g>
    <use href="#g" fill="url(#fup)" fill-opacity="0.970" fill-rule="nonzero"/>
  </g>
</svg>
