<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
<!-- Head and bust, authored from the original's own geometry rather than traced: the head is
     a circle at (24.44,20.0) r 11.9, the bust an ellipse at (24.44,59.5) 19.82 by 32.2 whose
     top is cut by the neckline, and both sit on a graded panel. Tracing this gave a squared
     head, straight shoulders and visible banding down the gradient. -->
<defs>
  <linearGradient id="av-panel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="50">
    <stop offset="0" stop-color="#e3e3e1"/>
    <stop offset="0.12" stop-color="#e3e3e1"/>
    <stop offset="1" stop-color="#dbdbd9"/>
  </linearGradient>
  <linearGradient id="av-head" gradientUnits="userSpaceOnUse" x1="0" y1="8.1" x2="0" y2="31.9">
    <stop offset="0" stop-color="#fbfbfa"/>
    <stop offset="1" stop-color="#e7e7e5"/>
  </linearGradient>
  <linearGradient id="av-body" gradientUnits="userSpaceOnUse" x1="0" y1="27.3" x2="0" y2="50">
    <stop offset="0" stop-color="#f7f7f6"/>
    <stop offset="1" stop-color="#e8e8e6"/>
  </linearGradient>
  <linearGradient id="av-rim" gradientUnits="userSpaceOnUse" x1="0" y1="8.1" x2="0" y2="15.5">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="av-cast" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.3"/>
  </filter>
  <clipPath id="av-neck">
    <path d="M-5,32.4 L13.7,32.4 Q24.44,38.4 35.2,32.4 L55,32.4 L55,55 L-5,55 Z"/>
  </clipPath>
</defs>
<rect width="50" height="50" fill="url(#av-panel)"/>
<g fill="#000000" fill-opacity="0.09" filter="url(#av-cast)" transform="translate(0,1.6)">
  <circle cx="24.44" cy="20.0" r="11.9"/>
  <ellipse cx="24.44" cy="59.5" rx="19.82" ry="32.2" clip-path="url(#av-neck)"/>
</g>
<g clip-path="url(#av-neck)">
  <ellipse cx="24.44" cy="59.5" rx="19.82" ry="32.2" fill="url(#av-body)"/>
</g>
<circle cx="24.44" cy="20.0" r="11.9" fill="url(#av-head)"/>
<circle cx="24.44" cy="20.0" r="11.4" fill="none" stroke="url(#av-rim)" stroke-width="1"/>
</svg>
