<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
<!-- Microphone, authored rather than traced. The capsule is a true pill 6.786 wide - its
     corner radius is exactly half its width, fitted off the original's top four rows at
     r 3.432 against a half-width of 3.443, which is a semicircle to a hundredth of a
     pixel. The cradle round it drops 5.121 either side of centre, runs straight for seven
     rows and then curves into the stem, stroked 1.59. It is not a half-ellipse: the
     original keeps its sides vertical over those rows, where an ellipse bows out at the
     top and in at the bottom. The stem and foot are rectangles, and every part is
     centred on x 16.00.
     Nothing here is engraved. The rest of the toolbar carries a line of the opposite
     tone a pixel below its lower edge; this glyph does not, in either state - the
     original holds exactly zero ink below the foot, and the foot is a plain rectangle
     whose own coverage accounts for its alpha to within 8 of 255. -->
