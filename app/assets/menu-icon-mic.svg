    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#7f7f7f" stop-opacity="1.0"/>
      <stop offset="0.091" stop-color="#7f7f7f" stop-opacity="1.0"/>
