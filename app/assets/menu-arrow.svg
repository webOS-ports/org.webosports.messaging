<svg xmlns="http://www.w3.org/2000/svg" width="14" height="10" viewBox="0 0 14 10">
<!-- The dropdown triangle Enyo 1 put after a list selector's label (Onyx theme menu-arrow.png,
     14x10), measured off that PNG: a dark triangle with its top edge from (1,1) to (12,1) and its
     point at (6.5,8.5), about 65% opaque, over a white copy one pixel lower that shows as a light
     bevel along the two lower edges. -->
<polygon points="1,2 12,2 6.5,9.5" fill="#ffffff" fill-opacity="0.6"/>
<polygon points="1,1 12,1 6.5,8.5" fill="#000000" fill-opacity="0.65"/>
</svg>
