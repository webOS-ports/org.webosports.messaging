<svg xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
<!-- Calendar badge, drawn rather than resampled: a white page with a blue header, two wire
     binder rings through the top and the bottom-right corner curling up off the sheet. A
     redraw of the community artwork it replaces, so that it holds up at any size instead of
     carrying a 41px resample around with it. -->
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.72" stop-color="#fbfbfb"/>
    <stop offset="1" stop-color="#d9d9d9"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe2f4"/><stop offset="0.55" stop-color="#9fcff0"/>
    <stop offset="1" stop-color="#7fb2e0"/>
  </linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8d969b"/><stop offset="0.45" stop-color="#4e565b"/>
    <stop offset="1" stop-color="#2d3337"/>
  </linearGradient>
  <linearGradient id="curl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9c9c9c"/><stop offset="1" stop-color="#efefef"/>
  </linearGradient>
  <clipPath id="sheet">
    <rect x="4.91" y="8.15" width="31.02" height="27.11" rx="1.60"/>
  </clipPath>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.95"/>
  </filter>
</defs>
<circle cx="21.77" cy="22.07" r="16.45" fill="#000000" fill-opacity="0.30"
        filter="url(#soft)"/>
<path d="M11.41,1.65 Q11.41,-0.35 14.29,-0.35 Q17.16,-0.35 17.16,1.65 L17.16,11.15 L15.41,11.15 L15.41,3.40 Q15.41,1.40 14.29,1.40 Q13.16,1.40 13.16,3.40 L13.16,11.15 L11.41,11.15 Z" fill="url(#wire)"/>
<path d="M24.44,1.65 Q24.44,-0.35 27.31,-0.35 Q30.19,-0.35 30.19,1.65 L30.19,11.15 L28.44,11.15 L28.44,3.40 Q28.44,1.40 27.31,1.40 Q26.19,1.40 26.19,3.40 L26.19,11.15 L24.44,11.15 Z" fill="url(#wire)"/>
<rect x="4.91" y="8.15" width="31.02" height="27.11" rx="1.60" fill="url(#page)"
      stroke="#c6c6c6" stroke-width="0.5"/>
<g clip-path="url(#sheet)">
  <rect x="4.91" y="8.15" width="31.02" height="7.22" fill="url(#head)"/>
  <rect x="4.91" y="15.38" width="31.02" height="0.7" fill="#ffffff" fill-opacity="0.8"/>
  <path d="M36.35,34.85 L14.60,34.85 Q30.91,27.24 36.35,24.70 Z"
        fill="url(#curl)"/>
</g>
</svg>
