<svg xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
<!-- Calendar badge. A pad of pages on the disc the artwork sits in: the top sheet white with
     a blue header, two chrome rings through it - drawn back half, page, front half, so they
     read as passing through - and the lower right corner curling up off the sheet. From the
     1024px master in the webOS-Ports graphics repository, drawn rather than resampled. -->
<defs>
  <linearGradient id="disc" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.420"/>
    <stop offset="0.45" stop-color="#c8c8c8" stop-opacity="0.200"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.200"/>
  </linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.8" stop-color="#fbfbfb"/>
    <stop offset="1" stop-color="#e6e6e6"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a8d4ef"/><stop offset="0.5" stop-color="#8dc3e8"/>
    <stop offset="1" stop-color="#79b4e0"/>
  </linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#3f474d"/><stop offset="0.3" stop-color="#cfd8de"/>
    <stop offset="0.55" stop-color="#616b72"/><stop offset="0.8" stop-color="#a7b1b8"/>
    <stop offset="1" stop-color="#2d3338"/>
  </linearGradient>
  <linearGradient id="curl" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#b4b4b4"/><stop offset="0.45" stop-color="#e4e4e4"/>
    <stop offset="1" stop-color="#fdfdfd"/>
  </linearGradient>
  <clipPath id="sheet"><path d="M6.945,8.887 L34.055,8.887 A0.645,0.645 0 0 1 34.700,9.532 L34.700,31.918 A0.645,0.645 0 0 1 34.055,32.562 L6.945,32.562 A0.645,0.645 0 0 1 6.300,31.918 L6.300,9.532 A0.645,0.645 0 0 1 6.945,8.887 Z"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="0.90"/>
  </filter>
  <filter id="dsoft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="0.55"/>
  </filter>
</defs>
<circle cx="20.54" cy="20.55" r="17.54" fill="url(#disc)" filter="url(#dsoft)"/>
  <ellipse cx="13.38" cy="8.00" rx="2.45" ry="4.30" fill="none" stroke="url(#wire)" stroke-width="1.25"/>
  <ellipse cx="27.69" cy="8.00" rx="2.45" ry="4.30" fill="none" stroke="url(#wire)" stroke-width="1.25"/>

<path d="M6.945,8.887 L34.055,8.887 A0.645,0.645 0 0 1 34.700,9.532 L34.700,31.918 A0.645,0.645 0 0 1 34.055,32.562 L6.945,32.562 A0.645,0.645 0 0 1 6.300,31.918 L6.300,9.532 A0.645,0.645 0 0 1 6.945,8.887 Z" fill="#000000" fill-opacity="0.320" filter="url(#soft)"
      transform="translate(0,1.00)"/>
<path d="M5.825,8.887 L35.175,8.887 A0.645,0.645 0 0 1 35.820,9.532 L35.820,34.717 A0.645,0.645 0 0 1 35.175,35.362 L5.825,35.362 A0.645,0.645 0 0 1 5.180,34.717 L5.180,9.532 A0.645,0.645 0 0 1 5.825,8.887 Z" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="0.3"/>
<path d="M6.105,8.887 L34.895,8.887 A0.645,0.645 0 0 1 35.540,9.532 L35.540,34.017 A0.645,0.645 0 0 1 34.895,34.663 L6.105,34.663 A0.645,0.645 0 0 1 5.460,34.017 L5.460,9.532 A0.645,0.645 0 0 1 6.105,8.887 Z" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="0.3"/>
<path d="M6.385,8.887 L34.615,8.887 A0.645,0.645 0 0 1 35.260,9.532 L35.260,33.317 A0.645,0.645 0 0 1 34.615,33.962 L6.385,33.962 A0.645,0.645 0 0 1 5.740,33.317 L5.740,9.532 A0.645,0.645 0 0 1 6.385,8.887 Z" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="0.3"/>
<path d="M6.665,8.887 L34.335,8.887 A0.645,0.645 0 0 1 34.980,9.532 L34.980,32.617 A0.645,0.645 0 0 1 34.335,33.263 L6.665,33.263 A0.645,0.645 0 0 1 6.020,32.617 L6.020,9.532 A0.645,0.645 0 0 1 6.665,8.887 Z" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="0.3"/>

<path d="M6.945,8.887 L34.055,8.887 A0.645,0.645 0 0 1 34.700,9.532 L34.700,31.918 A0.645,0.645 0 0 1 34.055,32.562 L6.945,32.562 A0.645,0.645 0 0 1 6.300,31.918 L6.300,9.532 A0.645,0.645 0 0 1 6.945,8.887 Z" fill="url(#page)" stroke="#c4c4c4" stroke-width="0.4"/>
<g clip-path="url(#sheet)">
  <rect x="6.30" y="8.89" width="28.40" height="6.35" fill="url(#head)"/>
  <rect x="6.30" y="15.24" width="28.40" height="0.45" fill="#ffffff" fill-opacity="0.75"/>
</g>
<path d="M34.70,22.56 Q33.35,31.06 25.70,32.56 Q31.55,24.56 34.70,22.56 Z" fill="url(#curl)"/>
  <path d="M10.93,8.00 A2.45,4.30 0 0 0 15.82,8.00" fill="none" stroke="url(#wire)" stroke-width="1.25" stroke-linecap="round"/>
  <path d="M25.24,8.00 A2.45,4.30 0 0 0 30.14,8.00" fill="none" stroke="url(#wire)" stroke-width="1.25" stroke-linecap="round"/>

</svg>
