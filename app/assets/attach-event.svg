<svg xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
<!-- Calendar badge, drawn to the original rather than resampled from a launcher icon - which
     is why there is no disc behind it: the badge the app shows never had one. A white page
     with a blue header, two clips over the top of it, and the grey sweep across its lower
     half where the corner lifts. The 1024px master in the webOS-Ports graphics repository is
     the reference for how the parts are drawn; the composition is the original's. -->
<defs>
  <linearGradient id="page" x1="0" y1="14.4" x2="0" y2="35.4" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#fdfdfd"/>
    <stop offset="1" stop-color="#eeeeee"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="6.6" x2="0" y2="14.4" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9ad2f3"/><stop offset="0.5" stop-color="#84c5f0"/>
    <stop offset="1" stop-color="#6fb4ed"/>
  </linearGradient>
  <linearGradient id="clip" x1="0" y1="2.6" x2="0.3" y2="13.3" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9ea2a7"/><stop offset="0.45" stop-color="#6d757b"/>
    <stop offset="1" stop-color="#3f4850"/>
  </linearGradient>
  <linearGradient id="sweep" x1="1" y1="0" x2="0.1" y2="1">
    <stop offset="0" stop-color="#aab2bb" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#c8ced5" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#eef1f4" stop-opacity="0.95"/>
  </linearGradient>
  <clipPath id="sheet"><path d="M5.033,6.625 L34.242,6.625 A1.245,1.245 0 0 1 35.487,7.870 L35.487,34.130 A1.245,1.245 0 0 1 34.242,35.375 L5.033,35.375 A1.245,1.245 0 0 1 3.788,34.130 L3.788,7.870 A1.245,1.245 0 0 1 5.033,6.625 Z"/></clipPath>
</defs>
<path d="M5.033,6.625 L34.242,6.625 A1.245,1.245 0 0 1 35.487,7.870 L35.487,34.130 A1.245,1.245 0 0 1 34.242,35.375 L5.033,35.375 A1.245,1.245 0 0 1 3.788,34.130 L3.788,7.870 A1.245,1.245 0 0 1 5.033,6.625 Z" fill="url(#page)"/>
<g clip-path="url(#sheet)">
  <rect x="3.79" y="6.62" width="31.70" height="7.74" fill="url(#head)"/>
  <rect x="3.79" y="13.86" width="31.70" height="0.5" fill="#3f82b8" fill-opacity="0.55"/>
  <path d="M36.54,20.00 Q31.57,26.50 4.20,33.20 L4.20,35.00 Q26.00,33.50 36.20,26.50 Z" fill="url(#sweep)"/>
  <rect x="3.79" y="33.38" width="31.70" height="2.00" fill="#4d5359"
        fill-opacity="0.70"/>
</g>
<rect x="10.24" y="2.59" width="2.33" height="10.69" rx="0.51" fill="url(#clip)"/>
<rect x="26.61" y="2.59" width="2.33" height="10.69" rx="0.51" fill="url(#clip)"/>

</svg>
