<svg xmlns="http://www.w3.org/2000/svg" width="44" height="64" viewBox="0 0 44 64">
<!-- Two figures, authored rather than traced. Each is a head circle over a bust that is a
     rounded rectangle - head r 5.66 at (17.41,7.40) over a bust 8.59..25.98 with the top corners
     filleted 4.76, and the companion r 4.39 at (29.61,12.90). The traced version squared the
     head off and ran the shoulders straight, which is what made it read a fifth too heavy. -->
  <defs>
    <linearGradient id="fdn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#000000" stop-opacity="0.365"/>
      <stop offset="0.091" stop-color="#010101" stop-opacity="0.647"/>
      <stop offset="0.182" stop-color="#080808" stop-opacity="0.58"/>
      <stop offset="0.273" stop-color="#141414" stop-opacity="0.608"/>
      <stop offset="0.364" stop-color="#404040" stop-opacity="0.608"/>
      <stop offset="0.455" stop-color="#1b1b1b" stop-opacity="0.58"/>
      <stop offset="0.545" stop-color="#242424" stop-opacity="0.553"/>
      <stop offset="0.636" stop-color="#030303" stop-opacity="0.518"/>
      <stop offset="0.727" stop-color="#040404" stop-opacity="0.439"/>
      <stop offset="0.818" stop-color="#060606" stop-opacity="0.424"/>
      <stop offset="0.909" stop-color="#343434" stop-opacity="0.502"/>
      <stop offset="1.000" stop-color="#cacaca" stop-opacity="0.537"/>
    </linearGradient>
    <linearGradient id="fup" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0.000" stop-color="#f6f6f6" stop-opacity="0.886"/>
      <stop offset="0.091" stop-color="#f6f6f6" stop-opacity="0.886"/>
      <stop offset="0.182" stop-color="#f9f9f9" stop-opacity="0.82"/>
      <stop offset="0.273" stop-color="#f5f5f5" stop-opacity="0.78"/>
      <stop offset="0.364" stop-color="#e7e7e7" stop-opacity="0.745"/>
      <stop offset="0.455" stop-color="#d7d7d7" stop-opacity="0.733"/>
      <stop offset="0.545" stop-color="#d4d4d4" stop-opacity="0.643"/>
      <stop offset="0.636" stop-color="#f7f7f7" stop-opacity="0.627"/>
      <stop offset="0.727" stop-color="#fafafa" stop-opacity="0.537"/>
      <stop offset="0.818" stop-color="#f9f9f9" stop-opacity="0.486"/>
