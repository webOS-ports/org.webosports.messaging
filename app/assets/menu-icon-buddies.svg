    <path id="g" d="M11.750,7.400 A5.662,5.662 0 1 1 23.075,7.400 A5.662,5.662 0 1 1 11.750,7.400 Z M13.350,13.613 L21.213,13.613 A4.763,4.763 0 0 1 25.975,18.375 L25.975,26.337 A4.112,4.112 0 0 1 21.863,30.450 L12.700,30.450 A4.112,4.112 0 0 1 8.588,26.337 L8.588,18.375 A4.763,4.763 0 0 1 13.350,13.613 Z M25.225,12.900 A4.388,4.388 0 1 1 34.000,12.900 A4.388,4.388 0 1 1 25.225,12.900 Z M26.163,17.600 L32.212,17.600 A4.375,4.375 0 0 1 36.587,21.975 L36.587,26.675 A3.775,3.775 0 0 1 32.812,30.450 L25.562,30.450 A3.775,3.775 0 0 1 21.788,26.675 L21.788,21.975 A4.375,4.375 0 0 1 26.163,17.600 Z"/>
